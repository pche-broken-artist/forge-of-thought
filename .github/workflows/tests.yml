# The forge's tests on every push and pull request, on Linux and
# Windows, Python 3.8 and the newest: the portability rule of
# CLAUDE.md, Persistence, as a run (projects/forge/00-brief-tests.md).
# The same suite runs locally with `python -m pytest`.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest
